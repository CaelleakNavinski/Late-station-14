- type: entity
  id: ActionVampireBite
  parent: BaseAction
  name: Sire Bite
  description: Sink your fangs into a living victim and begin the slow blessing of vampirism.
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: _LateStation/Interface/Actions/actions_vampire.rsi
      state: sire_bite
  - type: TargetAction
  - type: EntityTargetAction
    event: !type:VampireBiteActionEvent

- type: entity
  id: ActionVampireFeed
  parent: BaseAction
  name: Feed
  description: Drink deeply from a nearby victim to sustain yourself and build blood power.
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: _LateStation/Interface/Actions/actions_vampire.rsi
      state: feed
  - type: TargetAction
  - type: EntityTargetAction
    event: !type:VampireFeedActionEvent

- type: entity
  id: ActionVampireBloodSprint
  parent: BaseAction
  name: Bloodsprint
  description: Burn blood to move with spernatural quickness for a few seconds.
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: _LateStation/Interface/Actions/actions_vampire.rsi
      state: blood_sprint
    useDelay: 20
  - type: InstantAction
    event: !type:VampireBloodSprintActionEvent