- type: entity
  id: LateBasicStationEventScheduler
  parent: BaseGameRule
  components:
  - type: BasicStationEventScheduler
    scheduledGameRules: !type:NestedSelector
      tableId: LateBasicGameRulesTable

- type: entityTable
  id: LateBasicGameRulesTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
      - !type:NestedSelector
        tableId: BasicCalmEventsTable
#      - !type:NestedSelector
#        tableId: BasicAntagEventsTable
      - !type:NestedSelector
        tableId: CargoGiftsTable
      - !type:NestedSelector
        tableId: CalmPestEventsTable
      - !type:NestedSelector
        tableId: SpicyPestEventsTable

- type: entity
  id: Vampire
  parent: BaseGameRule
  components:
  - type: GameRule
  - type: VampireRule
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ VampMatriarch ]
      max: 1
      briefing:
        text: vamp-mat-role-greeting
        color: Red
      mindRoles:
      - MindRoleVampireMatriarch
  - type: DynamicRuleCost
    cost: 200
